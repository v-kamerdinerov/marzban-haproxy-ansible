---
- name: "Marzban | Configure {{ role | upper() }} | Haproxy"
  include_tasks: haproxy.yml

- name: "Marzban | Configure {{ role | upper() }} | Create folders"
  ansible.builtin.file:
    path: "{{ item.value }}"
    state: directory
    recurse: true
    owner: root
    group: root
  with_dict: "{{ marzban_system_dirs }}"

- name: "Marzban | Configure {{ role | upper() }} | Template Docker compose configs"
  template:
    src: "{{ item.src }}"
    dest: "{{ marzban_system_dirs | json_query('[*].base_dir') | first }}/{{ item.dst }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: docker-compose.yml.j2, dst: docker-compose.yml, mode: "0644"}
    - {src: certbot-exec.sh.j2, dst: certbot-exec.sh, mode: "0755"}
    - {src: certbot-creds.sh.j2, dst: certbot-creds.sh, mode: "0755"}
    - {src: env.j2, dst: .env, mode: "0644"}

- name: "Marzban | Configure {{ role | upper() }} | Generate private key if not exist"
  block:
    - name: "Marzban | Configure {{ role | upper() }} | Check if X25519 key file exists"
      stat:
        path: "{{ marzban_vless_private_key_path }}"
      register: key_stat

    - name: "Marzban | Configure {{ role | upper() }} | Info"
      debug:
        msg: |
          INFO:
          --------------------------------------------
          Get marzban docker image...
          Image name: {{ marzban_image }}
          Image tag: {{ marzban_image_tag }}
          --------------------------------------------
      changed_when: false
      when: not key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Generate X25519 key if it does not exist"
      command: "docker run --rm {{ marzban_image }} xray x25519"
      register: generate_key_result
      changed_when: false
      when: not key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Set new Private key"
      set_fact:
        new_key: "{{ generate_key_result.stdout | regex_search('Private key: (.+)', '\\1') | first }}"
      when: not key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Save to file"
      copy:
        content: "{{ new_key }}"
        dest: "{{ marzban_vless_private_key_path }}"
        owner: root
        group: root
        mode: '0644'
      when: not key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Read the existing key"
      slurp:
        src: "{{ marzban_vless_private_key_path }}"
      register: existing_key
      when: key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Set existing Private Key"
      set_fact:
        marzban_vless_private_key: "{{ existing_key.content | b64decode }}"
      when: key_stat.stat.exists

    - name: "Marzban | Configure {{ role | upper() }} | Set new Private key"
      set_fact:
        marzban_vless_private_key: "{{ new_key }}"
      when: not key_stat.stat.exists
  when: marzban_vless_private_key is not defined or marzban_vless_private_key|length == 0

- name: "Marzban | Configure {{ role | upper() }} | Template xray config"
  template:
    src: "{{ item.src }}"
    dest: "{{ marzban_system_dirs | json_query('[*].work_dir') | first }}/{{ item.dst }}"
    mode: "{{ item.mode }}"
    validate: /usr/bin/jq empty %s
  loop:
    - {src: xray_config.json.j2, dst: xray_config.json, mode: "0644"}

- name: "Marzban | Configure {{ role | upper() }} | Add subscription template"
  copy:
    src: "index.html"
    dest: "{{ marzban_system_dirs | json_query('[*].templates_dir') | first }}/index.html"
    mode: "0644"
  when: marzban_custom_subscription_template is defined and marzban_custom_subscription_template

- name: "Marzban | Configure {{ role | upper() }} | Template ssl certificate"
  copy:
    dest: "{{ (marzban_system_dirs | json_query('[*].certs_dir') | first) }}/{{ item.key }}"
    owner: root
    group: root
    mode: '0655'
    backup: false
    content: "{{ item.value }}"
  no_log: true
  loop: "{{ vault_ssl_certs | dict2items }}"
  when: 
    - marzban_auto_cert is not defined or not marzban_auto_cert
    - vault_ssl_certs is defined

- name: "Marzban | Configure {{ role | upper() }} | Debug DNS credentials"
  debug:
    msg: |
      DNS Credentials Debug Info:
      - Provider: {{ marzban_cert_dns_provider }}
      - Credentials defined: {{ marzban_cert_dns_credentials is defined }}
      - Credentials content: {{ marzban_cert_dns_credentials | to_nice_json }}
      - Expected environment variables will be:
      {% for key, value in marzban_cert_dns_credentials.items() %}
      - {{ key | upper }}={{ value if value else '(EMPTY VALUE!)' }}
      {% endfor %}
  when: 
    - marzban_auto_cert is defined and marzban_auto_cert
    - marzban_cert_challenge_method == "dns"
    - marzban_cert_dns_credentials is defined

- name: "Marzban | Configure {{ role | upper() }} | Validate certificate configuration"
  assert:
    that:
      - marzban_cert_domains is defined and marzban_cert_domains | length > 0
      - marzban_cert_challenge_method in ["http", "dns"]
    fail_msg: |
      Certificate configuration is incomplete. Please ensure:
      - marzban_cert_domains contains at least one domain
      - marzban_cert_challenge_method is either "http" or "dns"
      Note: marzban_cert_email will use a default if not set, but it's recommended to set a real email
    success_msg: "Certificate configuration is valid"
  when: marzban_auto_cert is defined and marzban_auto_cert

- name: "Marzban | Configure {{ role | upper() }} | Validate DNS provider configuration"
  assert:
    that:
      - marzban_cert_dns_provider is defined and marzban_cert_dns_provider != ""
      - marzban_cert_dns_credentials is defined and marzban_cert_dns_credentials | length > 0
    fail_msg: |
      DNS provider configuration is incomplete. Please ensure:
      - marzban_cert_dns_provider is set (e.g., 'cloudns', 'cloudflare')
      - marzban_cert_dns_credentials contains the required credentials
    success_msg: "DNS provider configuration is valid"
  when: 
    - marzban_auto_cert is defined and marzban_auto_cert
    - marzban_cert_challenge_method == "dns"

- name: "Marzban | Configure {{ role | upper() }} | Show certificate configuration"
  debug:
    msg: |
      Certificate Configuration:
      - Domain: {{ marzban_domain }}
      - Email: {{ marzban_cert_email if marzban_cert_email else 'default email will be used' }}
      - Challenge Method: {{ marzban_cert_challenge_method | default('http') }}
      - Staging: {{ marzban_cert_staging | default(false) }}
      - Domains: {{ marzban_cert_domains | default([]) | join(', ') }}
      - DNS Provider: {{ marzban_cert_dns_provider if marzban_cert_dns_provider else 'none' }}
      - Renewal Interval: {{ marzban_cert_renewal_interval | default('43200') }} seconds
  when: marzban_auto_cert is defined and marzban_auto_cert

- name: "Marzban | Configure {{ role | upper() }} | Create and start services"
  community.docker.docker_compose_v2:
    project_src: "{{ marzban_system_dirs | json_query('[*].base_dir') | first }}"
  register: startup_output

- name: "Marzban | Configure {{ role | upper() }} | Show bootstrap result"
  ansible.builtin.debug:
    var: startup_output

- name: "Marzban | Configure {{ role | upper() }} | Wait for marzban to be ready"
  uri:
    url: "https://{{ marzban_panel_uri }}/api/admin/token"
    method: POST
    headers:
      accept: "application/json"
      Content-Type: "application/x-www-form-urlencoded"
    body:
      grant_type: "password"
      username: "{{ marzban_panel_login }}"
      password: "{{ marzban_panel_password }}"
      scope: ""
      client_id: ""
      client_secret: ""
    body_format: form-urlencoded
    return_content: true
    validate_certs: false  # Allow self-signed certificates during initial setup
  retries: 20
  delay: 15
  register: token_data
  until: token_data is not failed
  tags: bootstrap

- name: "Marzban | Configure {{ role | upper() }} | Get host info"
  uri:
    url: "https://{{ marzban_panel_uri }}/api/hosts"
    method: GET
    headers:
      accept: "application/json"
      Authorization: "Bearer {{ (token_data.content | from_json).access_token }}"
      Content-Type: "application/json"
    body_format: json
    return_content: true
    validate_certs: false
  retries: 8
  delay: 5
  register: panel_hosts_info
  until: panel_hosts_info is not failed
  tags: bootstrap

- name: "Marzban | Configure {{ role | upper() }} | Update host info"
  uri:
    url: "https://{{ marzban_panel_uri }}/api/hosts"
    method: PUT
    headers:
      accept: "application/json"
      Authorization: "Bearer {{ (token_data.content | from_json).access_token }}"
      Content-Type: "application/json"
    body:
      VLESS TCP REALITY: "{{ marzban_panel_host_info }}"
    body_format: json
    return_content: true
    validate_certs: false
  retries: 8
  delay: 5
  register: panel_host_info_change
  until: panel_host_info_change is not failed
  tags: bootstrap

- name: "Marzban | Configure {{ role | upper() }} | Backup"
  include_tasks: ../backup.yml
  when:
    - marzban_backup is defined and marzban_backup
